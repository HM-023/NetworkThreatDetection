<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title"><title id="title">Network Threat Detection architecture overview</title><rect width="1440" height="720" rx="22" fill="#0B1220"/><text x="50" y="66" fill="#F3F6FA" font-size="32" font-weight="700" text-anchor="start" font-family="DejaVu Sans, sans-serif">Evaluation pipeline</text><text x="50" y="106" fill="#A6B6CB" font-size="18" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Implemented workflow · synthetic data validates execution, not real-traffic accuracy</text><path d="M 50 132 H 1390" fill="none" stroke="#293A50" stroke-width="2.5"/><path d="M 390 235 H 570 M 870 235 H 1050 M 1200 278 V 407 M 1050 450 H 870 M 570 450 H 390" fill="none" stroke="#64E2C3" stroke-width="2.5"/><rect x="60.0" y="192" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="80.0" cy="216" r="4" fill="#64E2C3"/><text x="97.0" y="223" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">01  Read labeled CSV</text><text x="80.0" y="254" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Numeric features; Label target</text><rect x="540.0" y="192" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="560.0" cy="216" r="4" fill="#64E2C3"/><text x="577.0" y="223" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">02  Clean records</text><text x="560.0" y="254" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Drop IDs; handle non-finite values</text><rect x="1020.0" y="192" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="1040.0" cy="216" r="4" fill="#64E2C3"/><text x="1057.0" y="223" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">03  Stratified holdout</text><text x="1040.0" y="254" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Split before fitting transformations</text><rect x="1020.0" y="407" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="1040.0" cy="431" r="4" fill="#64E2C3"/><text x="1057.0" y="438" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">04  Fit training pipeline</text><text x="1040.0" y="469" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Impute; optional scale; classifier</text><rect x="540.0" y="407" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="560.0" cy="431" r="4" fill="#64E2C3"/><text x="577.0" y="438" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">05  Evaluate holdout</text><text x="560.0" y="469" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Apply the fitted pipeline to test rows</text><rect x="60.0" y="407" width="360" height="86" rx="16" fill="#111E31" stroke="#293A50"/><circle cx="80.0" cy="431" r="4" fill="#64E2C3"/><text x="97.0" y="438" fill="#F3F6FA" font-size="20" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">06  Write reports</text><text x="80.0" y="469" fill="#A6B6CB" font-size="15" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Metrics, matrix and run metadata</text><text x="60" y="600" fill="#64E2C3" font-size="16" font-weight="600" text-anchor="start" font-family="DejaVu Sans, sans-serif">MODEL OPTIONS</text><text x="60" y="638" fill="#F3F6FA" font-size="24" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">Random Forest  /  Logistic Regression</text><text x="60" y="684" fill="#A6B6CB" font-size="18" font-weight="400" text-anchor="start" font-family="DejaVu Sans, sans-serif">No packet capture, pretrained model or real dataset is distributed.</text></svg>
